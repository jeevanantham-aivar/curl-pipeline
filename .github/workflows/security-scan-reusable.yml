                    echo "Creating fallback report..."
                    # Create a comprehensive fallback report
                    echo "# 🚀 Final Combined Security Scan Report" > ./${FINAL_REPORT}
                    echo "" >> ./${FINAL_REPORT}
                    echo "## 📊 Summary Across All Environments" >> ./${FINAL_REPORT}
                    echo "" >> ./${FINAL_REPORT}
                    echo "**Branch:** \`${BRANCH_NAME}\`" >> ./${FINAL_REPORT}
                    echo "**Generated:** $(date)" >> ./${FINAL_REPORT}

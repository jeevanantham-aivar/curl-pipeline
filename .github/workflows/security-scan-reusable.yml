name: Security Scan Reusable

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  run-scan:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
      REPO_NAME: ${{ github.repository }}
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      COMMIT_ID: ${{ github.event.pull_request.head.sha }}
      ENVIRONMENT: ${{ inputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::302263040839:role/Githubactions
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Bandit and Checkov
        run: pip install bandit checkov

      - name: Set Terraform Var File
        run: echo "TFVARS=${ENVIRONMENT}/terraform.tfvars" >> $GITHUB_ENV

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: Terraform

      - name: Terraform Plan
        run: terraform plan -var-file=./environments/${TFVARS} -out=tfplan.binary
        working-directory: Terraform

      - name: Convert Plan to JSON
        run: terraform show -json tfplan.binary > tfplan.json
        working-directory: Terraform

      - name: Run Bandit
        run: bandit -r . -f json -o bandit-report.json || true

      - name: Run Checkov (scan plan)
        run: checkov -f tfplan.json --repo-root-for-plan-enrichment . -o json > checkov-report.json || true
        working-directory: Terraform



      # 👇 keep your existing PR comment + S3 upload steps here, unchanged
      - name: Post PR comments for infra failures
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            GITHUB_REPOSITORY: ${{ github.repository }}
            PR_NUMBER: ${{ github.event.pull_request.number }}
            COMMIT_ID: ${{ github.event.pull_request.head.sha }}
        run: |
            if [ -f Terraform/checkov-report.json ] && jq -e '.results.failed_checks | length > 0' Terraform/checkov-report.json > /dev/null; then
            jq -c '.results.failed_checks[]' Terraform/checkov-report.json | while read -r issue; do
                PATH_TO_FILE=$(echo "$issue" | jq -r '.file_path')
                LINE=$(echo "$issue" | jq -r '.file_line_range[0]')
                BODY=$(echo "$issue" | jq -r '.check_id + ": " + .check_name')

                if [[ -n "$PATH_TO_FILE" && -n "$LINE" && -n "$BODY" ]]; then
                # Adjust line number based on environment
                if [[ "$ENVIRONMENT" == "development" ]]; then
                    ADJUSTED_LINE=$((LINE - 1))
                elif [[ "$ENVIRONMENT" == "production" ]]; then
                    ADJUSTED_LINE=$LINE
                elif [[ "$ENVIRONMENT" == "staging" ]]; then
                    ADJUSTED_LINE=$((LINE + 1))
                else
                    ADJUSTED_LINE=$LINE
                fi

                # Construct the full path relative to the repository root.
                # Since Checkov runs in 'Terraform/' and its file_path is relative to that,
                # we must prepend 'Terraform/' to get the correct repository-relative path.
                DISPLAY_PATH="Terraform/${PATH_TO_FILE}"

                echo "Posting comment for: $BODY at $DISPLAY_PATH:$ADJUSTED_LINE (original: $LINE, environment: $ENVIRONMENT)"
                curl -L -X POST \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer $GITHUB_TOKEN" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments" \
                    -d "{
                    \"body\": \"$BODY\",
                    \"commit_id\": \"$COMMIT_ID\",
                    \"path\": \"$DISPLAY_PATH\",
                    \"line\": $ADJUSTED_LINE
                    }"

                    echo "------ DEBUGGING PR COMMENT PAYLOAD ------"
                    echo "API URL: https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments"
                    echo "BODY: $BODY"
                    echo "COMMIT_ID: $COMMIT_ID"
                    echo "PATH: $DISPLAY_PATH"
                    echo "LINE: $LINE"
                    echo "-----------------------------------------"
                else
                echo "Skipping comment due to missing data: Path=$PATH_TO_FILE, Line=$LINE, Body=$BODY"
                fi
            done
            else
            echo "No failed Checkov checks found or report file is missing."
            fi

            echo "------ DEBUGGING PR COMMENT PAYLOAD ------"
            echo "API URL: https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
            echo "BODY: $BODY"
            echo "COMMIT_ID: $COMMIT_ID"
            echo "PATH: $DISPLAY_PATH"
            echo "LINE: $LINE"
            echo "-----------------------------------------"

      - name: Post PR comments for Bandit failures
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            GITHUB_REPOSITORY: ${{ github.repository }}
            PR_NUMBER: ${{ github.event.pull_request.number }}
            COMMIT_ID: ${{ github.event.pull_request.head.sha }}
        run: |
            if [ -f bandit-report.json ] && jq -e '.results | length > 0' bandit-report.json > /dev/null; then
            jq -c '.results[]' bandit-report.json | while read -r issue; do
                PATH_TO_FILE=$(echo "$issue" | jq -r '.filename')
                LINE=$(echo "$issue" | jq -r '.line_number')
                ISSUE_TEXT=$(echo "$issue" | jq -r '.issue_text')
                SEVERITY=$(echo "$issue" | jq -r '.issue_severity')
                CONFIDENCE=$(echo "$issue" | jq -r '.issue_confidence')

                BODY="Bandit: $ISSUE_TEXT (Severity: $SEVERITY, Confidence: $CONFIDENCE)"

                if [[ -n "$PATH_TO_FILE" && -n "$LINE" && -n "$BODY" ]]; then
                # Adjust line number based on environment
                if [[ "$ENVIRONMENT" == "development" ]]; then
                    ADJUSTED_LINE=$((LINE - 1))
                elif [[ "$ENVIRONMENT" == "production" ]]; then
                    ADJUSTED_LINE=$LINE
                elif [[ "$ENVIRONMENT" == "staging" ]]; then
                    ADJUSTED_LINE=$((LINE + 1))
                else
                    ADJUSTED_LINE=$LINE
                fi

                DISPLAY_PATH="${PATH_TO_FILE#./}"  # remove leading ./ if present

                echo "Posting Bandit comment for: $BODY at $DISPLAY_PATH:$ADJUSTED_LINE (original: $LINE, environment: $ENVIRONMENT)"
                curl -L -X POST \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer $GITHUB_TOKEN" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments" \
                    -d "{
                    \"body\": \"$BODY\",
                    \"commit_id\": \"$COMMIT_ID\",
                    \"path\": \"$DISPLAY_PATH\",
                    \"line\": $ADJUSTED_LINE
                    }"

                echo "------ DEBUGGING BANDIT COMMENT PAYLOAD ------"
                echo "PATH: $DISPLAY_PATH"
                echo "LINE: $LINE"
                echo "BODY: $BODY"
                echo "----------------------------------------------"
                else
                echo "Skipping Bandit issue due to missing data: Path=$PATH_TO_FILE, Line=$LINE, Body=$BODY"
                fi
            done
            else
            echo "No Bandit issues found or bandit-report.json missing."
            fi


    
      - name: Format Reports
        run: |
            REPORT="${ENVIRONMENT}.md"
            echo "# :shield: Security Scan Report for [${ENVIRONMENT}]" > $REPORT
            echo "" >> $REPORT

            CHECKOV_PASSED=$(jq '.summary.passed' Terraform/checkov-report.json 2>/dev/null || echo "0")
            CHECKOV_FAILED=$(jq '.summary.failed' Terraform/checkov-report.json 2>/dev/null || echo "0")
            CHECKOV_SKIPPED=$(jq '.summary.skipped' Terraform/checkov-report.json 2>/dev/null || echo "0")
            BANDIT_FAILED=$(jq '.results | length' bandit-report.json 2>/dev/null || echo "0")

            {
            echo "1️⃣ **Checkov Report**"
            echo "   - 🟢 **PASSED Checks:** $CHECKOV_PASSED"
            echo "   - 🔴 **FAILED Checks:** $CHECKOV_FAILED"
            echo "   - ⚠️  **SKIPPED Checks:** $CHECKOV_SKIPPED"
            echo ""
            echo "2️⃣ **Bandit Report**"
            echo "   - 🔴 **FAILED Checks:** $BANDIT_FAILED"
            echo ""
            if [ "$CHECKOV_FAILED" -eq 0 ] && [ "$BANDIT_FAILED" -eq 0 ]; then
                echo ":white_check_mark: Everything looks secure. Great job! 🔐"
            else
                echo "*⚡️ Every 🔴 is a risk bomb. Defuse before you MERGE!*"
            fi
            echo ""
            echo "---"
            echo ""
            } >> $REPORT

            export REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
            export BRANCH="${GITHUB_HEAD_REF:-$(git rev-parse --abbrev-ref HEAD)}"

            echo "## :cloud: Checkov Detailed Report" >> $REPORT
            echo "" >> $REPORT

            if [ -f Terraform/checkov-report.json ]; then
            FAILED=$(jq '.results.failed_checks | length' Terraform/checkov-report.json 2>/dev/null || echo "0")
            if [ "$FAILED" -gt 0 ]; then
                jq -r --arg repo_url "$REPO_URL" --arg branch "$BRANCH" '
                .results.failed_checks[]? |
                    "- **" + (.check_id // "N/A") + ":** " + (.check_name // "N/A") + "\n" +
                    (
                    if (.file_path // "") != "" and
                        ((.file_line_range | type) == "array" and (.file_line_range | length) > 0)
                    then
                        "  - **Location:** [`" + (.file_path | ltrimstr("/")) + ":" + ((.file_line_range[0]|tostring) // "?") + "`]" +
                        "(" + $repo_url + "/blob/" + $branch + "/Terraform/" + (.file_path | ltrimstr("/")) + "#L" + ((.file_line_range|tostring) // "") + ")\n"
                    elif .resource_address then
                        "  - **Resource:** `" + .resource_address + "`\n"
                    else "" end
                    ) +
                    "  - **Severity:** " + ((.severity // "N/A")) + "\n" +
                    "  - **Guideline:** " + ((.guideline // "N/A")) + "\n" +
                    "  - **Description:** " + ((.description // .check_name // "No description provided.")) + "\n"
                ' Terraform/checkov-report.json >> $REPORT
            else
                echo ":white_check_mark: **No failed infrastructure checks found!**" >> $REPORT
            fi
            else
            echo ":warning: Checkov report not generated." >> $REPORT
            fi

            echo "" >> $REPORT
            echo "---" >> $REPORT
            echo "" >> $REPORT

            echo "## :snake: Bandit Detailed Report" >> $REPORT
            echo "" >> $REPORT

            if [ -f bandit-report.json ]; then
            COUNT=$(jq '.results | length' bandit-report.json 2>/dev/null || echo "0")
            if [ "$COUNT" -gt 0 ]; then
                jq -r --arg repo_url "$REPO_URL" --arg branch "$BRANCH" '
                .results[] |
                    "### Issue: " + (.issue_text // "N/A") + "\n" +
                    "- **Location:** [`" + (.filename // "unknown") + ":" + ((.line_number | tostring) // "?") + "`]" +
                    "(" + $repo_url + "/blob/" + $branch + "/" + (.filename | ltrimstr("/")) + "#L" + (.line_number|tostring) + ")\n" +
                    "- **Severity:** " + (.issue_severity // "N/A") + "\n" +
                    "- **Confidence:** " + (.issue_confidence // "N/A") + "\n" +
                    "- **CWE:** [" + ((.issue_cwe.id | tostring) // "N/A") + "](" + (.issue_cwe.link // "#") + ")\n" +
                    "---\n"
                ' bandit-report.json >> $REPORT
            else
                echo ":white_check_mark: **No Bandit issues found!**" >> $REPORT
            fi
            else
            echo ":warning: Bandit report not generated." >> $REPORT
            fi

            echo "" >> $REPORT
            echo "---" >> $REPORT
            echo "*This report was generated automatically by the Security Scan Pipeline*" >> $REPORT

      - name: Wait for S3 Lock and Update Combined Report
        env:
            AWS_REGION: ap-south-1
            REPO_NAME: ${{ github.repository }}
            BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
            COMMIT_ID: ${{ github.event.pull_request.head.sha }}
            ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: |
            S3_BUCKET="github-pullrequest-reports"
            BRANCH_PREFIX="${REPO_NAME}/${BRANCH_NAME}"
            LOCK_FILE="lock-${BRANCH_PREFIX//\//-}.txt"
            LOCK_COUNTER_FILE="lock-counter-${BRANCH_PREFIX//\//-}.txt"
            COMBINED_REPORT="combined-report.md"
            MAX_WAIT_TIME=300  # 5 minutes max wait
            WAIT_INTERVAL=10   # Check every 10 seconds
            
            echo "🔒 Attempting to acquire lock for combined report update..."
            
            # Try to acquire lock
            for ((i=0; i<MAX_WAIT_TIME; i+=WAIT_INTERVAL)); do
                # Check if lock exists
                if aws s3 ls "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_FILE}" >/dev/null 2>&1; then
                    echo "⏳ Lock exists, waiting ${WAIT_INTERVAL} seconds... (${i}/${MAX_WAIT_TIME}s)"
                    sleep $WAIT_INTERVAL
                else
                    # Try to create lock
                    echo "🔓 Attempting to acquire lock..."
                    echo "$(date): Locked by ${ENVIRONMENT} pipeline" | aws s3 cp - "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_FILE}" --content-type "text/plain"
                    
                    # Verify lock was created (handle race condition)
                    sleep 2
                    if aws s3 ls "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_FILE}" >/dev/null 2>&1; then
                        echo "✅ Lock acquired successfully!"
                        break
                    else
                        echo "❌ Lock acquisition failed, retrying..."
                        continue
                    fi
                fi
            done
            
            # Check if we got the lock
            if ! aws s3 ls "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_FILE}" >/dev/null 2>&1; then
                echo "❌ Failed to acquire lock after ${MAX_WAIT_TIME} seconds"
                exit 1
            fi
            
            # Increment lock counter (LOCK ACQUIRED = +1) - ATOMIC UPDATE
            echo "🔢 Incrementing lock counter (LOCK ACQUIRED)..."
            
            # Use atomic counter update with retry mechanism
            MAX_RETRIES=5
            for retry in $(seq 1 $MAX_RETRIES); do
                if aws s3 ls "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_COUNTER_FILE}" >/dev/null 2>&1; then
                    # Download existing counter
                    aws s3 cp "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_COUNTER_FILE}" ./lock-counter.txt
                    CURRENT_COUNT=$(cat ./lock-counter.txt)
                    NEW_COUNT=$((CURRENT_COUNT + 1))
                    echo "📊 Lock counter: ${CURRENT_COUNT} → ${NEW_COUNT} (attempt ${retry})"
                else
                    # Create new counter
                    NEW_COUNT=1
                    echo "📊 Lock counter: 0 → ${NEW_COUNT} (attempt ${retry})"
                fi
                
                # Upload updated counter
                echo "${NEW_COUNT}" > ./lock-counter.txt
                aws s3 cp ./lock-counter.txt "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_COUNTER_FILE}"
                
                # Verify the update was successful
                sleep 1
                aws s3 cp "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_COUNTER_FILE}" ./verify-counter.txt
                VERIFIED_COUNT=$(cat ./verify-counter.txt)
                
                if [ "$VERIFIED_COUNT" -eq "$NEW_COUNT" ]; then
                    echo "✅ Lock counter updated to: ${NEW_COUNT} (verified)"
                    break
                else
                    echo "⚠️ Counter verification failed: expected ${NEW_COUNT}, got ${VERIFIED_COUNT}"
                    if [ "$retry" -eq "$MAX_RETRIES" ]; then
                        echo "❌ Failed to update counter after ${MAX_RETRIES} attempts"
                        exit 1
                    fi
                    echo "🔄 Retrying counter update..."
                    sleep 2
                fi
            done
            
            # Download existing combined report or create new one
            if aws s3 ls "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${COMBINED_REPORT}" >/dev/null 2>&1; then
                echo "📥 Downloading existing combined report..."
                aws s3 cp "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${COMBINED_REPORT}" ./existing-report.md
            else
                echo "📝 Creating new combined report..."
                echo "# 🚀 Combined Security Scan Report" > ./existing-report.md
                echo "" >> ./existing-report.md
                echo "## 📊 Summary Across All Environments" >> ./existing-report.md
                echo "" >> ./existing-report.md
                echo "**Branch:** \`${BRANCH_NAME}\`" >> ./existing-report.md
                echo "**Generated:** $(date)" >> ./existing-report.md
                echo "" >> ./existing-report.md
            fi
            
            # Verify environment report exists before adding to combined report
            if [ ! -f "${ENVIRONMENT}.md" ]; then
                echo "❌ Error: ${ENVIRONMENT}.md not found!"
                echo "Current directory contents:"
                ls -la
                exit 1
            fi
            
            # Add current environment report to combined report
            echo "## 🔒 ${ENVIRONMENT^} Environment Report" >> ./existing-report.md
            echo "" >> ./existing-report.md
            cat "${ENVIRONMENT}.md" >> ./existing-report.md
            echo "" >> ./existing-report.md
            echo "---" >> ./existing-report.md
            echo "" >> ./existing-report.md
            
            # Upload updated combined report
            echo "📤 Uploading updated combined report..."
            aws s3 cp ./existing-report.md "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${COMBINED_REPORT}"
            
            # Increment lock counter (LOCK RELEASED = +1) - ATOMIC UPDATE
            echo "🔢 Incrementing lock counter (LOCK RELEASED)..."
            
            # Use atomic counter update with retry mechanism
            MAX_RETRIES=5
            for retry in $(seq 1 $MAX_RETRIES); do
                # Ensure lock counter file exists and is readable
                if ! aws s3 ls "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_COUNTER_FILE}" >/dev/null 2>&1; then
                    echo "❌ Lock counter file not found during release, creating new one..."
                    echo "1" > ./lock-counter.txt
                    aws s3 cp ./lock-counter.txt "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_COUNTER_FILE}"
                    CURRENT_COUNT=1
                else
                    aws s3 cp "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_COUNTER_FILE}" ./lock-counter.txt
                    CURRENT_COUNT=$(cat ./lock-counter.txt)
                fi
                
                NEW_COUNT=$((CURRENT_COUNT + 1))
                echo "📊 Lock counter: ${CURRENT_COUNT} → ${NEW_COUNT} (attempt ${retry})"
                
                # Upload updated counter
                echo "${NEW_COUNT}" > ./lock-counter.txt
                aws s3 cp ./lock-counter.txt "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_COUNTER_FILE}"
                
                # Verify the update was successful
                sleep 1
                aws s3 cp "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_COUNTER_FILE}" ./verify-counter.txt
                VERIFIED_COUNT=$(cat ./verify-counter.txt)
                
                if [ "$VERIFIED_COUNT" -eq "$NEW_COUNT" ]; then
                    echo "✅ Lock counter updated to: ${NEW_COUNT} (verified)"
                    break
                else
                    echo "⚠️ Counter verification failed: expected ${NEW_COUNT}, got ${VERIFIED_COUNT}"
                    if [ "$retry" -eq "$MAX_RETRIES" ]; then
                        echo "❌ Failed to update counter after ${MAX_RETRIES} attempts"
                        exit 1
                    fi
                    echo "🔄 Retrying counter update..."
                    sleep 2
                fi
            done
            
            # Release lock
            echo "🔓 Releasing lock..."
            aws s3 rm "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_FILE}"
            echo "✅ Lock released successfully!"
            
            # Final verification
            echo "🔍 Final verification - Lock counter should be: ${NEW_COUNT}"
            if aws s3 ls "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_COUNTER_FILE}" >/dev/null 2>&1; then
                aws s3 cp "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_COUNTER_FILE}" ./final-verify.txt
                FINAL_VERIFY=$(cat ./final-verify.txt)
                echo "✅ Verified lock counter in S3: ${FINAL_VERIFY}"
            else
                echo "❌ Lock counter file not found after release!"
            fi

   
     
      - name: Upload Reports to S3
        env:
            AWS_REGION: ap-south-1
            REPO_NAME: ${{ github.repository }}
            BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
            COMMIT_ID: ${{ github.event.pull_request.head.sha }}
            ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: |
            S3_BUCKET="github-pullrequest-reports"
            PREFIX="${REPO_NAME}/${BRANCH_NAME}/${ENVIRONMENT}"
            BRANCH_PREFIX="${REPO_NAME}/${BRANCH_NAME}"
            REPORT="${ENVIRONMENT}.md"

            echo "📤 Uploading environment-specific reports to s3://${S3_BUCKET}/${PREFIX}/"
            aws s3 cp bandit-report.json s3://${S3_BUCKET}/${PREFIX}/bandit-report.json || true
            aws s3 cp Terraform/checkov-report.json s3://${S3_BUCKET}/${PREFIX}/checkov-report.json || true
            aws s3 cp $REPORT s3://${S3_BUCKET}/${PREFIX}/${ENVIRONMENT}.md || true
            
            echo "📤 Combined report already uploaded to s3://${S3_BUCKET}/${BRANCH_PREFIX}/combined-report.md"

      - name: Display S3 Report Location
        run: |
            S3_BUCKET="github-pullrequest-reports"
            PREFIX="${REPO_NAME}/${BRANCH_NAME}/${ENVIRONMENT}"
            BRANCH_PREFIX="${REPO_NAME}/${BRANCH_NAME}"
            
            echo "## 📁 S3 Report Location for ${ENVIRONMENT}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Environment:** \`${ENVIRONMENT}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Environment Reports:** \`s3://${S3_BUCKET}/${PREFIX}/\`" >> $GITHUB_STEP_SUMMARY
            echo "**Combined Report:** \`s3://${S3_BUCKET}/${BRANCH_PREFIX}/combined-report.md\`" >> $GITHUB_STEP_SUMMARY
            
            # Display lock counter information
            if aws s3 ls "s3://${S3_BUCKET}/${BRANCH_PREFIX}/lock-counter-${BRANCH_PREFIX//\//-}.txt" >/dev/null 2>&1; then
                aws s3 cp "s3://${S3_BUCKET}/${BRANCH_PREFIX}/lock-counter-${BRANCH_PREFIX//\//-}.txt" ./lock-counter-display.txt
                LOCK_COUNT=$(cat ./lock-counter-display.txt)
                echo "**Lock Counter:** \`${LOCK_COUNT}/6\` (${ENVIRONMENT} environment)" >> $GITHUB_STEP_SUMMARY
            else
                echo "**Lock Counter:** \`Not found\` (${ENVIRONMENT} environment)" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Available Reports:**" >> $GITHUB_STEP_SUMMARY
            echo "- **Bandit:** [Open in AWS Console](https://console.aws.amazon.com/s3/object/${S3_BUCKET}/${PREFIX}/bandit-report.json) | [Download (1h)](https://${S3_BUCKET}.s3.${AWS_REGION}.amazonaws.com/${PREFIX}/bandit-report.json)" >> $GITHUB_STEP_SUMMARY
            echo "- **Checkov:** [Open in AWS Console](https://console.aws.amazon.com/s3/object/${S3_BUCKET}/${PREFIX}/checkov-report.json) | [Download (1h)](https://${S3_BUCKET}.s3.${AWS_REGION}.amazonaws.com/${PREFIX}/checkov-report.json)" >> $GITHUB_STEP_SUMMARY
            echo "- **Environment Report:** [Open in AWS Console](https://console.aws.amazon.com/s3/object/${S3_BUCKET}/${PREFIX}/${ENVIRONMENT}.md) | [Download (1h)](https://${S3_BUCKET}.s3.${AWS_REGION}.amazonaws.com/${PREFIX}/${ENVIRONMENT}.md)" >> $GITHUB_STEP_SUMMARY
            echo "- **Combined Report:** [Open in AWS Console](https://console.aws.amazon.com/s3/object/${S3_BUCKET}/${BRANCH_PREFIX}/combined-report.md) | [Download (1h)](https://${S3_BUCKET}.s3.${AWS_REGION}.amazonaws.com/${BRANCH_PREFIX}/combined-report.md)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "*Reports uploaded for ${ENVIRONMENT} environment*" >> $GITHUB_STEP_SUMMARY

      - name: Check Lock Status
        env:
            AWS_REGION: ap-south-1
            REPO_NAME: ${{ github.repository }}
            BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
            COMMIT_ID: ${{ github.event.pull_request.head.sha }}
            ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: |
            S3_BUCKET="github-pullrequest-reports"
            BRANCH_PREFIX="${REPO_NAME}/${BRANCH_NAME}"
            LOCK_FILE="lock-${BRANCH_PREFIX//\//-}.txt"
            LOCK_COUNTER_FILE="lock-counter-${BRANCH_PREFIX//\//-}.txt"
            
            echo "🔍 Checking lock status for debugging..."
            
            # Check if lock file exists
            if aws s3 ls "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_FILE}" >/dev/null 2>&1; then
                echo "🔒 Lock file EXISTS - Another environment is currently updating"
                aws s3 cp "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_FILE}" ./lock-info.txt
                LOCK_CONTENT=$(cat ./lock-info.txt)
                echo "📝 Lock content: ${LOCK_CONTENT}"
            else
                echo "🔓 Lock file NOT FOUND - No environment is currently updating"
            fi
            
            # Check lock counter
            if aws s3 ls "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_COUNTER_FILE}" >/dev/null 2>&1; then
                aws s3 cp "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_COUNTER_FILE}" ./counter-info.txt
                COUNTER_VALUE=$(cat ./counter-info.txt)
                echo "📊 Lock counter: ${COUNTER_VALUE}/6"
                
                # Analyze counter value
                case $COUNTER_VALUE in
                    1) echo "💡 Status: 1 environment acquired lock, not released yet" ;;
                    2) echo "💡 Status: 1 environment completed (acquired + released)" ;;
                    3) echo "💡 Status: 1 environment completed + 1 environment acquired lock" ;;
                    4) echo "💡 Status: 2 environments completed" ;;
                    5) echo "💡 Status: 2 environments completed + 1 environment acquired lock" ;;
                    6) echo "🎉 Status: All 3 environments completed!" ;;
                    *) echo "⚠️ Status: Unexpected counter value" ;;
                esac
            else
                echo "❌ Lock counter file not found"
            fi

      - name: Download Combined Report for PR
        env:
            AWS_REGION: ap-south-1
            REPO_NAME: ${{ github.repository }}
            BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
            COMMIT_ID: ${{ github.event.pull_request.head.sha }}
            ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: |
            S3_BUCKET="github-pullrequest-reports"
            BRANCH_PREFIX="${REPO_NAME}/${BRANCH_NAME}"
            COMBINED_REPORT="combined-report.md"
            LOCK_COUNTER_FILE="lock-counter-${BRANCH_PREFIX//\//-}.txt"
            
            echo "📥 Checking lock counter before downloading combined report..."
            
            # Wait for lock counter to reach 6 (all environments completed)
            MAX_WAIT_TIME=600  # 10 minutes max wait
            WAIT_INTERVAL=30   # Check every 30 seconds
            TARGET_COUNT=6     # Target lock count
            STUCK_THRESHOLD=300 # 5 minutes stuck threshold
            
            for ((i=0; i<MAX_WAIT_TIME; i+=WAIT_INTERVAL)); do
                if aws s3 ls "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_COUNTER_FILE}" >/dev/null 2>&1; then
                    # Download current counter
                    aws s3 cp "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_COUNTER_FILE}" ./lock-counter.txt
                    CURRENT_COUNT=$(cat ./lock-counter.txt)
                    echo "📊 Current lock counter: ${CURRENT_COUNT}/${TARGET_COUNT} (${i}/${MAX_WAIT_TIME}s)"
                    
                    if [ "$CURRENT_COUNT" -ge "$TARGET_COUNT" ]; then
                        echo "🎯 Lock counter reached target! All environments completed."
                        break
                    else
                        echo "⏳ Waiting for lock counter to reach ${TARGET_COUNT}..."
                        
                        # Check if counter is stuck for too long
                        if [ "$i" -ge "$STUCK_THRESHOLD" ] && [ "$CURRENT_COUNT" -ge 4 ]; then
                            echo "⚠️ Lock counter stuck at ${CURRENT_COUNT}/${TARGET_COUNT} for too long!"
                            echo "🔧 Force completing lock counter to prevent infinite wait..."
                            
                            # Force complete the counter
                            FORCE_COUNT=$TARGET_COUNT
                            echo "${FORCE_COUNT}" > ./lock-counter.txt
                            aws s3 cp ./lock-counter.txt "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_COUNTER_FILE}"
                            echo "✅ Force completed lock counter to: ${FORCE_COUNT}/${TARGET_COUNT}"
                            break
                        fi
                        
                        sleep $WAIT_INTERVAL
                    fi
                else
                    echo "⏳ Lock counter file not found yet, waiting ${WAIT_INTERVAL} seconds... (${i}/${MAX_WAIT_TIME}s)"
                    sleep $WAIT_INTERVAL
                fi
            done
            
            # Check if we reached the target count
            if aws s3 ls "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_COUNTER_FILE}" >/dev/null 2>&1; then
                aws s3 cp "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${LOCK_COUNTER_FILE}" ./lock-counter.txt
                FINAL_COUNT=$(cat ./lock-counter.txt)
                
                if [ "$FINAL_COUNT" -ge "$TARGET_COUNT" ]; then
                    echo "🎉 Lock counter: ${FINAL_COUNT}/${TARGET_COUNT} - All environments completed!"
                    
                    # Now download the combined report
                    if aws s3 ls "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${COMBINED_REPORT}" >/dev/null 2>&1; then
                        echo "✅ Combined report found, downloading..."
                        aws s3 cp "s3://${S3_BUCKET}/${BRANCH_PREFIX}/${COMBINED_REPORT}" ./combined-report.md
                        echo "📄 Combined report downloaded successfully"
                    else
                        echo "❌ Combined report not found despite lock counter completion"
                        exit 1
                    fi
                else
                    echo "⚠️ Lock counter not reached target: ${FINAL_COUNT}/${TARGET_COUNT}"
                    echo "Creating fallback report..."
                    # Create a fallback combined report with current environment
                    echo "# 🚀 Combined Security Scan Report" > ./combined-report.md
                    echo "" >> ./combined-report.md
                    echo "## 📊 Summary Across All Environments" >> ./combined-report.md
                    echo "" >> ./combined-report.md
                    echo "**Branch:** \`${BRANCH_NAME}\`" >> ./combined-report.md
                    echo "**Generated:** $(date)" >> ./combined-report.md
                    echo "" >> ./combined-report.md
                    echo "## 🔒 ${ENVIRONMENT^} Environment Report" >> ./combined-report.md
                    echo "" >> ./combined-report.md
                    cat "${ENVIRONMENT}.md" >> ./combined-report.md
                    echo "" >> ./combined-report.md
                    echo "---" >> ./combined-report.md
                    echo "" >> ./combined-report.md
                    echo "*Note: Only ${ENVIRONMENT} environment report available. Lock counter: ${FINAL_COUNT}/${TARGET_COUNT}*" >> ./combined-report.md
                fi
            else
                echo "⚠️ Lock counter file not found, creating fallback report..."
                # Create a fallback combined report with current environment
                echo "# 🚀 Combined Security Scan Report" > ./combined-report.md
                echo "" >> ./combined-report.md
                echo "## 📊 Summary Across All Environments" >> ./combined-report.md
                echo "" >> ./combined-report.md
                echo "**Branch:** \`${BRANCH_NAME}\`" >> ./combined-report.md
                echo "**Generated:** $(date)" >> ./combined-report.md
                echo "" >> ./combined-report.md
                echo "## 🔒 ${ENVIRONMENT^} Environment Report" >> ./combined-report.md
                echo "" >> ./combined-report.md
                cat "${ENVIRONMENT}.md" >> ./combined-report.md
                echo "" >> ./combined-report.md
                echo "---" >> ./combined-report.md
                echo "" >> ./combined-report.md
                echo "*Note: Only ${ENVIRONMENT} environment report available. Lock counter file not found.*" >> ./combined-report.md
            fi

      - name: Post Environment Report to PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
            path: ${{ env.ENVIRONMENT }}.md
            header: "🔒 Security Scan Report - ${{ env.ENVIRONMENT }} Environment"

      - name: Post Combined Report to PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
            path: combined-report.md
            header: "🚀 Combined Security Scan Report - All Environments"

      - name: Create Final Combined Report

                    echo "**Lock Counter:** ${FINAL_COUNT}/6 ⚠️" >> ./${FINAL_REPORT}
                    echo "" >> ./${FINAL_REPORT}
                    echo "## 🔒 ${ENVIRONMENT^} Environment Report" >> ./${FINAL_REPORT}
                    echo "" >> ./${FINAL_REPORT}
                    cat "${ENVIRONMENT}.md" >> ./${FINAL_REPORT}
                    echo "" >> ./${FINAL_REPORT}
                    echo "---" >> ./${FINAL_REPORT}
                    echo "" >> ./${FINAL_REPORT}
                    echo "*Note: Only ${ENVIRONMENT} environment report available. Lock counter: ${FINAL_COUNT}/6*" >> ./${FINAL_REPORT}
                fi
            else
                echo "⚠️ Lock counter file not found, creating fallback report..."
                # Create a comprehensive fallback report
                echo "# 🚀 Final Combined Security Scan Report" > ./${FINAL_REPORT}
                echo "" >> ./${FINAL_REPORT}
                echo "## 📊 Summary Across All Environments" >> ./${FINAL_REPORT}
                echo "" >> ./${FINAL_REPORT}
                echo "**Branch:** \`${BRANCH_NAME}\`" >> ./${FINAL_REPORT}
                echo "**Generated:** $(date)" >> ./${FINAL_REPORT}
